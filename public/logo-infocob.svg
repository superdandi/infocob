<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ba112a" />
      <stop offset="100%" stop-color="#e01e3e" />
    </linearGradient>
  </defs>

  <!-- Circuit traces (inspired by original header) -->
  <g stroke="#ba112a" stroke-width="1.5" opacity="0.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top left cluster -->
    <path d="M20 20 L50 20 L50 40 L80 40" />
    <path d="M20 40 L40 40 L40 60 L60 60 L60 80" />
    <path d="M10 60 L30 60 L30 30 L60 30" />
    <circle cx="20" cy="20" r="3" fill="#ba112a" />
    <circle cx="20" cy="40" r="2" fill="#ba112a" />
    <circle cx="80" cy="40" r="2.5" fill="#ba112a" />
    <circle cx="60" cy="80" r="2" fill="#ba112a" />
    <circle cx="10" cy="60" r="2.5" fill="#ba112a" />
    <circle cx="60" cy="30" r="2" fill="#ba112a" />

    <!-- Mid-left -->
    <path d="M20 100 L70 100 L70 130 L100 130" />
    <path d="M30 110 L50 110 L50 140" />
    <path d="M15 130 L40 130 L40 90 L80 90" />
    <circle cx="20" cy="100" r="3" fill="#ba112a" />
    <circle cx="30" cy="110" r="2" fill="#ba112a" />
    <circle cx="15" cy="130" r="2" fill="#ba112a" />
    <circle cx="100" cy="130" r="2.5" fill="#ba112a" />

    <!-- Top right -->
    <path d="M340 30 L370 30 L370 50 L390 50" />
    <path d="M330 50 L360 50 L360 20 L390 20" />
    <path d="M350 70 L380 70" />
    <circle cx="340" cy="30" r="2.5" fill="#ba112a" />
    <circle cx="330" cy="50" r="2" fill="#ba112a" />
    <circle cx="350" cy="70" r="2.5" fill="#ba112a" />
    <circle cx="390" cy="50" r="3" fill="#ba112a" />
    <circle cx="390" cy="20" r="2" fill="#ba112a" />

    <!-- Mid-right -->
    <path d="M320 110 L360 110 L360 130 L390 130" />
    <path d="M340 90 L380 90 L380 100" />
    <path d="M330 140 L370 140" />
    <circle cx="320" cy="110" r="2" fill="#ba112a" />
    <circle cx="340" cy="90" r="2.5" fill="#ba112a" />
    <circle cx="330" cy="140" r="2" fill="#ba112a" />
    <circle cx="390" cy="130" r="2.5" fill="#ba112a" />

    <!-- Bottom center -->
    <path d="M160 140 L200 140 L200 130 L240 130 L240 140 L280 140" />
    <path d="M180 130 L180 120 L220 120 L220 130" />
    <circle cx="160" cy="140" r="2" fill="#ba112a" />
    <circle cx="280" cy="140" r="2" fill="#ba112a" />
    <circle cx="220" cy="120" r="2" fill="#ba112a" />

    <!-- Via nodes (double circles) -->
    <circle cx="50" cy="20" r="4" stroke="none" fill="#ba112a" opacity="0.15" />
    <circle cx="50" cy="20" r="2" fill="#ba112a" opacity="0.5" />

    <circle cx="370" cy="30" r="4" stroke="none" fill="#ba112a" opacity="0.15" />
    <circle cx="370" cy="30" r="2" fill="#ba112a" opacity="0.5" />

    <circle cx="350" cy="110" r="4" stroke="none" fill="#ba112a" opacity="0.15" />
    <circle cx="350" cy="110" r="2" fill="#ba112a" opacity="0.5" />
  </g>

  <!-- INFOCOB text -->
  <text x="200" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="6" fill="white">
    INFOCOB
  </text>

  <!-- Tagline -->
  <text x="200" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#00d4ff" opacity="0.9">
    DISEÑO DE NUEVOS PRODUCTOS DIGITALES
  </text>
</svg>
