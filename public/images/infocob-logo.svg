<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" fill="none">
  <!-- Circuit traces (gray) -->
  <g stroke="#999999" stroke-width="1.5" opacity="0.35" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top left -->
    <path d="M20 30 L60 30 L60 50 L90 50" />
    <path d="M20 50 L40 50 L40 70 L60 70 L60 90" />
    <path d="M10 70 L30 70 L30 40 L60 40" />
    <circle cx="20" cy="30" r="3" fill="#999999" />
    <circle cx="20" cy="50" r="2" fill="#999999" />
    <circle cx="90" cy="50" r="2.5" fill="#999999" />
    <circle cx="60" cy="90" r="2" fill="#999999" />
    <circle cx="10" cy="70" r="2.5" fill="#999999" />
    <circle cx="60" cy="40" r="2" fill="#999999" />

    <!-- Mid-left -->
    <path d="M20 130 L70 130 L70 160 L100 160" />
    <path d="M30 140 L50 140 L50 170" />
    <path d="M15 160 L40 160 L40 120 L80 120" />
    <circle cx="20" cy="130" r="3" fill="#999999" />
    <circle cx="30" cy="140" r="2" fill="#999999" />
    <circle cx="15" cy="160" r="2" fill="#999999" />
    <circle cx="100" cy="160" r="2.5" fill="#999999" />

    <!-- Bottom left -->
    <path d="M30 230 L70 230 L70 250 L110 250" />
    <path d="M20 240 L50 240 L50 260 L80 260" />
    <circle cx="30" cy="230" r="2.5" fill="#999999" />
    <circle cx="110" cy="250" r="2.5" fill="#999999" />
    <circle cx="80" cy="260" r="2" fill="#999999" />

    <!-- Top right -->
    <path d="M290 30 L330 30 L330 50 L370 50" />
    <path d="M280 50 L310 50 L310 20 L370 20" />
    <path d="M300 70 L340 70" />
    <circle cx="290" cy="30" r="2.5" fill="#999999" />
    <circle cx="280" cy="50" r="2" fill="#999999" />
    <circle cx="300" cy="70" r="2.5" fill="#999999" />
    <circle cx="370" cy="50" r="3" fill="#999999" />
    <circle cx="370" cy="20" r="2" fill="#999999" />

    <!-- Mid-right -->
    <path d="M280 130 L320 130 L320 160 L370 160" />
    <path d="M300 100 L350 100 L350 110" />
    <path d="M290 170 L340 170" />
    <circle cx="280" cy="130" r="2" fill="#999999" />
    <circle cx="300" cy="100" r="2.5" fill="#999999" />
    <circle cx="290" cy="170" r="2" fill="#999999" />
    <circle cx="370" cy="160" r="2.5" fill="#999999" />

    <!-- Bottom right -->
    <path d="M270 230 L310 230 L310 250 L360 250" />
    <path d="M290 210 L340 210" />
    <circle cx="270" cy="230" r="2" fill="#999999" />
    <circle cx="360" cy="250" r="2.5" fill="#999999" />
    <circle cx="340" cy="210" r="2.5" fill="#999999" />

    <!-- Bottom center -->
    <path d="M140 250 L190 250 L190 240 L240 240 L240 250 L270 250" />
    <path d="M170 240 L170 230 L210 230 L210 240" />
    <circle cx="140" cy="250" r="2" fill="#999999" />
    <circle cx="270" cy="250" r="2" fill="#999999" />
    <circle cx="210" cy="230" r="2" fill="#999999" />

    <!-- Extra traces for density -->
    <path d="M100 30 L130 30 L130 60 L160 60" />
    <path d="M260 60 L290 60 L290 40 L310 40" />
    <path d="M100 200 L140 200 L140 180 L170 180" />
    <path d="M240 190 L280 190 L280 210 L310 210" />
    <circle cx="100" cy="30" r="2" fill="#999999" />
    <circle cx="160" cy="60" r="2" fill="#999999" />
    <circle cx="260" cy="60" r="2" fill="#999999" />
    <circle cx="310" cy="40" r="2" fill="#999999" />
    <circle cx="100" cy="200" r="2" fill="#999999" />
    <circle cx="170" cy="180" r="2" fill="#999999" />
    <circle cx="240" cy="190" r="2.5" fill="#999999" />
    <circle cx="310" cy="210" r="2" fill="#999999" />

    <!-- Via nodes -->
    <circle cx="60" cy="30" r="4" fill="#999999" opacity="0.15" />
    <circle cx="60" cy="30" r="2" fill="#999999" opacity="0.5" />
    <circle cx="330" cy="30" r="4" fill="#999999" opacity="0.15" />
    <circle cx="330" cy="30" r="2" fill="#999999" opacity="0.5" />
    <circle cx="310" cy="130" r="4" fill="#999999" opacity="0.15" />
    <circle cx="310" cy="130" r="2" fill="#999999" opacity="0.5" />
  </g>

  <!-- INFOCOB text (red) -->
  <text x="190" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" letter-spacing="8" fill="#ba112a">
    INFOCOB
  </text>

  <!-- computación text (black) -->
  <text x="190" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" letter-spacing="4" fill="#111111" opacity="0.85">
    computación
  </text>
</svg>
